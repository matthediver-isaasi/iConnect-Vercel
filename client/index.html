<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

    <!-- Default title / description (replaced server-side by api/render.js per tenant) -->
    <title>iConn — Membership platform for organisations</title>
    <meta name="description" content="iConn is a multi-tenant membership platform for events, communities, fundraising, and member engagement." />

    <!-- Favicons (static so crawlers see them; dynamic-favicon swap is preserved for logged-in SPA users) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" id="dynamic-favicon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Open Graph (defaults; tenant SSR handler overrides these) -->
    <meta property="og:site_name" content="iConn" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="iConn — Membership platform for organisations" />
    <meta property="og:description" content="iConn is a multi-tenant membership platform for events, communities, fundraising, and member engagement." />
    <meta property="og:image" content="https://iconn.app/og-image.png" />
    <meta property="og:url" content="https://iconn.app/" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="iConn — Membership platform for organisations" />
    <meta name="twitter:description" content="iConn is a multi-tenant membership platform for events, communities, fundraising, and member engagement." />
    <meta name="twitter:image" content="https://iconn.app/og-image.png" />

    <script>
      (function() {
        var el = document.getElementById('dynamic-favicon');
        if (!el) return;
        fetch('/api/public/favicon-url')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data && data.faviconUrl && el.href !== data.faviconUrl) {
              el.href = data.faviconUrl;
            }
          }).catch(function() {});
      })();
    </script>
    <!-- Font Awesome (icon support for Canvas Builder Card icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Always-on base font (Poppins). Degular is locally hosted. All other tenant
         fonts load dynamically per-tenant from the installed_font table (client:
         InstalledFontsLoader / useInstalledFonts; SSR: api/_lib/renderHtml.js). -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
